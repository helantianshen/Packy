name: Packy builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/admin/package-lock.json
            web/desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 xvfb libnss3 libgtk-3-0t64 libasound2t64
      - run: npm ci && npm --prefix web/admin ci && npm --prefix web/desktop ci
      - run: go vet ./cmd/... ./internal/... ./pkg/... ./config/...
      - run: go test -race -timeout 120s ./cmd/... ./internal/... ./pkg/... ./config/...
      - run: npm run build && npm run format:check && npm run test:smoke
      - run: node --test web/desktop/tests/brand-files.test.cjs
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - run: npm run test:browser
      - run: npm --prefix web/desktop run electron:install
      - name: Electron startup and persistent settings
        shell: bash
        run: |
          mkdir -p web/desktop/sidecar
          go build -o web/desktop/sidecar/packy-client ./cmd/client
          export PACKY_PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright-core')")"
          xvfb-run -a node web/desktop/tests/gui-native.cjs
          xvfb-run -a node web/desktop/tests/download-settings-native.cjs
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: regression-diagnostics
          path: |
            test-results/
            .impeccable/review/client-b/*.png
          if-no-files-found: ignore
  portable:
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Native client core regression
        env:
          CGO_ENABLED: '0'
        run: go test -timeout 120s ./internal/client/... ./pkg/... ./config/...
      - run: npm --prefix web/desktop ci
      - run: node scripts/build-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: node --test web/desktop/tests/brand-files.test.cjs
      - name: Archive portable directory with permissions and links
        shell: bash
        run: |
          tar -czf "Packy-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C artifacts/desktop "Packy-${{ matrix.platform }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v6
        with:
          name: Packy-${{ matrix.platform }}-${{ matrix.arch }}
          path: Packy-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
  server-admin:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: node scripts/build-server.mjs
      - run: npm --prefix web/admin ci && npm --prefix web/admin run build
      - name: Archive independent server and admin
        run: |
          tar -czf packy-server-linux-x64.tar.gz -C artifacts server-linux-x64
          tar -czf packy-admin.tar.gz -C web/admin dist
      - uses: actions/upload-artifact@v6
        with:
          name: packy-server-linux-x64
          path: packy-server-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v6
        with:
          name: packy-admin
          path: packy-admin.tar.gz
          if-no-files-found: error
          compression-level: 0
