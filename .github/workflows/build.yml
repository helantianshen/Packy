name: Packy builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop-${{ matrix.platform }}-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Install frontend dependencies
        run: npm ci
      - name: Check native target and selected config
        run: npm run desktop:build -- --platform ${{ matrix.platform }} --check
      - name: Build script regression tests
        run: npm run test:build
      - name: Client regression tests
        run: cargo +stable test --locked -p packy-client
      - name: Build native executable
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: npm run release:build -- --only desktop --platform ${{ matrix.platform }}
      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: packy-desktop-${{ matrix.platform }}-${{ matrix.target }}
          path: artifacts/desktop/packy-desktop-${{ matrix.platform }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  server:
    name: server-linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Install frontend dependencies
        run: npm ci
      - name: Build script regression tests
        run: npm run test:build
      - name: Server regression tests
        run: cargo +stable test --locked -p packy-server
      - name: Build server and admin assets
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: npm run release:build -- --only server --platform linux
      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: packy-server-linux-x86_64-unknown-linux-gnu
          path: artifacts/server/packy-server-linux-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
